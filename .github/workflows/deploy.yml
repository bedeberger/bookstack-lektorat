name: CI + Deploy

on:
  pull_request:
  push:
    branches: [main]

# Der Runner teilt sich den LXC mit der Prod-App (und Bookstack) auf Ceph-RBD.
# Zwei gleichzeitige Laeufe verdoppeln die IO-Last exakt dort, wo sie am meisten
# weh tut. Darum serialisieren statt parallelisieren: PR-Laeufe werden vom
# Nachfolger abgeloest, main-Pushes reihen sich an (ein laufender Deploy darf
# nicht mittendrin abgebrochen werden).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks-and-unit:
    name: Static Checks + Unit-Tests
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Wegwerf-DB auf tmpfs (RAM) statt Ceph-RBD-Storage: eliminiert alle
      # SQLite-Writes der Integration-Job-Pipelines vom langsamen Netz-Storage.
      DB_PATH: /dev/shm/lektorat-ci-${{ github.run_id }}.db

    steps:
      # clean: false — der Default (`git clean -ffdx`) loescht node_modules, was
      # auf dem Netz-Storage 12k Datei-Deletes + anschliessend 12k Neuschreibungen
      # bedeutet. Der Workspace wird stattdessen unten gezielt geputzt.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Workspace putzen (node_modules bewusst ausgenommen)
        run: git clean -ffdx -e node_modules

      - name: Frische DB pro Run (self-hosted Runner persistiert sonst schreibwerkstatt.db)
        run: rm -f "$DB_PATH" "${DB_PATH}-shm" "${DB_PATH}-wal"

      # Kein actions/cache: auf einem Self-hosted-Runner ueberlebt node_modules
      # den Lauf ohnehin (siehe clean: false). Ein Cache-Restore wuerde 189 MB
      # ueber exakt die Dateien entpacken, die schon dastehen. Stattdessen
      # Stempel im node_modules-Baum: faellt der Ordner weg, faellt der Stempel
      # mit und `npm ci` laeuft automatisch wieder.
      - name: Deps installieren (nur bei geaendertem Lockfile)
        run: |
          set -e
          stamp=node_modules/.ci-lock-sha
          want=$(sha256sum package-lock.json | cut -d' ' -f1)
          if [ "$(cat "$stamp" 2>/dev/null)" = "$want" ]; then
            echo "node_modules aktuell (${want:0:12}) — Install uebersprungen"
          else
            npm ci --prefer-offline --no-audit --no-fund
            echo "$want" > "$stamp"
          fi

      - name: Syntax-Check (node --check auf allen JS-Dateien)
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f" 2>&1; then
              echo "::error file=$f::Syntaxfehler"
              fail=1
            fi
          done < <(find server.js logger.js lib routes db public/js scripts -type f -name '*.js' 2>/dev/null)
          exit $fail

      # Faengt benutzte-aber-nicht-importierte Symbole in public/js (entsteht beim
      # Aufteilen von Modulen). Der Syntax-Check oben sieht das nicht — die Datei
      # ist ja syntaktisch gueltig; im Browser knallt es erst zur Laufzeit.
      - name: Import-Gate (public/js — fehlende Imports)
        run: npm run test:imports

      - name: Prompt-Config validieren
        run: node scripts/validate-prompt-config.js

      - name: Boot-Smoke (Server startet, /config → 401)
        run: node scripts/boot-smoke.js

      - name: Architektur-Guards (grep-basiert)
        run: |
          set -e
          status=0

          echo "→ Keine statischen Inline-Styles in HTML (style=\"...\")"
          hits=$(grep -rEn '(^|[[:space:]])style="' public/partials public/index.html 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::Statische Inline-Styles gefunden — bitte in style.css auslagern:"
            echo "$hits"
            status=1
          fi

          echo "→ Keine <style>-Blöcke in HTML"
          hits=$(grep -rn --include='*.html' '<style' public/ 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::<style>-Blöcke gefunden — alle Styles gehören in public/style.css:"
            echo "$hits"
            status=1
          fi

          echo "→ JSON_ONLY-Konstante nur in public/js/prompts.js oder public/js/prompts/ (Kommentare ignoriert)"
          hits=$(grep -rHn 'JSON_ONLY' public/js routes lib 2>/dev/null \
                 | grep -v '^public/js/prompts.js:' \
                 | grep -v '^public/js/prompts/' \
                 | grep -Ev '//[^"]*JSON_ONLY' \
                 | grep -Ev '^[^:]+:[0-9]+:[[:space:]]*\*' || true)
          if [ -n "$hits" ]; then
            echo "::error::JSON_ONLY ausserhalb prompts.js / prompts/ referenziert — Prompts gehören nach public/js/prompts.js bzw. public/js/prompts/:"
            echo "$hits"
            status=1
          fi

          echo "→ callAI nur in routes/jobs/ und routes/chat.js"
          hits=$(grep -rln 'callAI(' routes lib 2>/dev/null \
                 | grep -v '^routes/jobs/' \
                 | grep -v '^routes/chat.js$' \
                 | grep -v '^lib/ai.js$' \
                 | grep -v '^lib/ai/' || true)
          if [ -n "$hits" ]; then
            echo "::error::callAI ausserhalb Job-Queue/Chat — KI-Calls müssen als Job-Typ implementiert werden:"
            echo "$hits"
            status=1
          fi

          echo "→ bsGet( für Listen (Pagination-Falle) — nur Warnung"
          grep -rEn 'bsGet\(.+/(books|pages|chapters|shelves)[^/]*\)' public/js 2>/dev/null \
            | grep -v 'bsGetAll' || echo "  (keine Treffer)"

          exit $status

      - name: Unit-Tests ausführen
        run: npm run test:unit

      - name: Integration-Tests ausführen (Job-Pipeline mit Mock-AI)
        run: npm run test:integration

  e2e:
    name: Playwright-E2E
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Workspace putzen (node_modules bewusst ausgenommen)
        run: git clean -ffdx -e node_modules

      - name: Deps installieren (nur bei geaendertem Lockfile)
        run: |
          set -e
          stamp=node_modules/.ci-lock-sha
          want=$(sha256sum package-lock.json | cut -d' ' -f1)
          if [ "$(cat "$stamp" 2>/dev/null)" = "$want" ]; then
            echo "node_modules aktuell (${want:0:12}) — Install uebersprungen"
          else
            npm ci --prefer-offline --no-audit --no-fund
            echo "$want" > "$stamp"
          fi

      # Zwei Engines: die Suite läuft auf Chromium, `*.webkit.spec.js` deckt die
      # Fehlerklassen ab, die nur WebKit zeigt (contenteditable-Selektion bei
      # Padding-Summe >= clientHeight) — siehe projects in playwright.config.js.
      #
      # Kein actions/cache: ~/.cache/ms-playwright liegt ausserhalb des
      # Workspaces und ueberlebt auf einem Self-hosted-Runner jeden Lauf — ein
      # Restore wuerde ~500 MB ueber bereits vorhandene Dateien entpacken.
      # `playwright install` ist selbst idempotent und laedt nur fehlende
      # Browser-Versionen nach. `--with-deps` (apt-get, jedes Mal IO + Netz) nur
      # beim allerersten Lauf auf einem frischen Runner.
      - name: Browser sicherstellen
        run: |
          if [ -d "$HOME/.cache/ms-playwright" ]; then
            npx playwright install chromium webkit
          else
            npx playwright install --with-deps chromium webkit
          fi

      - name: E2E-Tests ausführen
        run: npx playwright test --reporter=list

  deploy:
    name: Deploy to LXC with bookstack
    needs: [checks-and-unit, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # clean: false auch hier — sonst loescht der Deploy-Job das node_modules,
      # das die beiden Test-Jobs im selben Workspace stehen lassen, und der
      # naechste Lauf muesste zwingend neu installieren.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Workspace putzen (node_modules bewusst ausgenommen)
        run: git clean -ffdx -e node_modules

      - name: Deploy
        run: bash deploy/deploy.sh
