<!-- Figuren-Präsenz-Matrix: Kapitel (Zeilen) × Top-Figuren (Spalten).
     Cell-Wert = Anzahl Szenen pro (Figur, Kapitel), Intensität global skaliert.
     Horizontaler Scroll bei vielen Figuren. Leere Zellen = Figur fehlt im Kapitel.
     Immer medium — Matrix mit Spalten-Header braucht Breite (siehe DESIGN.md).
     Das Tabellen-Markup teilen sich alle drei Matrizen (Fragment-Include). -->
<template x-if="!overviewIsTagebuch() && overviewPresence('figuren').cols.length > 0">
  <div class="overview-tile overview-tile--medium"
       x-data="{ kind: 'figuren', labelKey: 'overview.figPresence' }">
    <!-- @include bookoverview-presence-matrix -->
  </div>
</template>
