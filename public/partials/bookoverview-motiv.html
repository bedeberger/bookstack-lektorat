<!-- Motiv-Präsenz-Matrix: Kapitel (Zeilen) × Top-Motive (Spalten).
     Cell-Wert = Ist-Fundstellen des Motivs im Kapitel (motif_occurrences,
     score-floor-gefiltert), Intensität global skaliert. Match per chapter_id,
     Sub-Kapitel auf Wurzel-Kapitel aggregiert. Klick → Motiv in der
     Motiv-Werkstatt öffnen. Immer medium — Matrix mit Spalten-Header braucht
     Breite (siehe DESIGN.md, analog Figuren-/Schauplatz-Matrix).
     Das Tabellen-Markup teilen sich alle drei Matrizen (Fragment-Include). -->
<template x-if="!overviewIsTagebuch() && overviewPresence('motive').cols.length > 0">
  <div class="overview-tile overview-tile--medium"
       x-data="{ kind: 'motive', labelKey: 'overview.motifPresence' }">
    <!-- @include bookoverview-presence-matrix -->
  </div>
</template>
