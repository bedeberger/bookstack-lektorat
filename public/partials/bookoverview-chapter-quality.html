<!-- Lektorat-Findings pro Kapitel: aus Heatmap aggregiert. Median, Bar
     und Sort basieren auf der absoluten Anzahl Findings; per1k bleibt
     als Sekundärwert im Datenmodell erhalten. Ungeprüfte Kapitel erscheinen
     nicht (ohne Prüfung ist „0 Findings" keine Aussage, siehe kapitel.js).
     Klick auf Tile-Header → Fehler-Heatmap; Zeilen sind nicht klickbar
     (Heatmap zeigt eh alles). Listen-Markup: @include unten. -->
<template x-if="!overviewIsTagebuch() && overviewChapterBars('findings').length > 0">
  <div class="overview-tile overview-tile--medium internal-link"
       @click="$app.toggleFehlerHeatmapCard()"
       x-data="{ kind: 'findings', labelKey: 'overview.chapterFindings' }">
    <!-- @include bookoverview-chapter-bars -->
  </div>
</template>

<!-- Lektoratszeit pro Kapitel: aus /history/lektorat-time per_chapter.
     Tracking läuft, solange checkDone (Prüfmodus) aktiv ist und der Tab
     sichtbar. Kapitel ohne erfasste Zeit erscheinen nicht. Sort: Sekunden
     desc; Diverging-Bar um den Median der Sekunden, Anzeige als exakte Dauer
     (h/min/s). Klick → BookStats (Total-Badges). Listen-Markup: @include unten. -->
<template x-if="overviewChapterBars('lektoratTime').length > 0">
  <div class="overview-tile overview-tile--medium internal-link"
       @click="_openLengthStats(0, 'lektorat_minutes')"
       x-data="{ kind: 'lektoratTime', labelKey: 'overview.chapterLektoratTime' }">
    <!-- @include bookoverview-chapter-bars -->
  </div>
</template>
