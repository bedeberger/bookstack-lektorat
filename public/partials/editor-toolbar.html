<!-- Edit-Toolbar: Bubble (Inline auf Selektion) + Slash (Block-Transforms).
     Beides nach <body> teleportiert, damit position:fixed nicht von einem
     transformierten Eltern-Container (Card) eingefangen wird.
     Nur in Edit-Mode aktiv, im Fokus-Modus strukturell ausgeblendet.
     Alpine.data-Sub — siehe public/js/cards/editor-toolbar-card.js. -->

<div x-data="editorToolbarCard" class="display-contents">
  <!-- Bubble-Toolbar (Inline-Formate) -->
  <template x-teleport="body">
    <div x-show="bubbleShow && $app.editMode && !$app.focusActive" x-cloak
         class="edit-bubble-toolbar"
         role="toolbar"
         :aria-label="$app.t('editor.toolbar.ariaLabel')"
         :style="{ left: bubbleX + 'px', top: bubbleY + 'px' }"
         @mousedown.prevent>
      <button type="button" class="edit-bubble-btn edit-bubble-btn--bold"   @click="toolbarBold()"   :data-tip="$app.t('editor.toolbar.boldTitle')"   :aria-label="$app.t('editor.toolbar.boldTitle')">B</button>
      <button type="button" class="edit-bubble-btn edit-bubble-btn--italic" @click="toolbarItalic()" :data-tip="$app.t('editor.toolbar.italicTitle')" :aria-label="$app.t('editor.toolbar.italicTitle')">I</button>
      <button type="button"
              x-show="bubbleSingleWord"
              class="edit-bubble-btn edit-bubble-btn--syn"
              @click="$app.openSynonymForCurrentSelection()"
              :data-tip="$app.t('editor.toolbar.synonymTitle')"
              :aria-label="$app.t('editor.toolbar.synonymTitle')"
              x-text="$app.t('editor.toolbar.synonymLabel')"></button>
      <button type="button"
              class="edit-bubble-btn edit-bubble-btn--link"
              @click="openLinkInput()"
              :data-tip="$app.t('editor.toolbar.linkTitle')"
              :aria-label="$app.t('editor.toolbar.linkTitle')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#external-link"/></svg>
      </button>
      <button type="button"
              class="edit-bubble-btn edit-bubble-btn--cite"
              @click="openCiteInput()"
              :data-tip="$app.t('editor.toolbar.citeTitle')"
              :aria-label="$app.t('editor.toolbar.citeTitle')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#quote"/></svg>
      </button>
      <button type="button"
              class="edit-bubble-btn edit-bubble-btn--xref"
              @click="openXrefInput()"
              :data-tip="$app.t('editor.toolbar.xrefTitle')"
              :aria-label="$app.t('editor.toolbar.xrefTitle')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#list-tree"/></svg>
      </button>
    </div>
  </template>

  <!-- Querverweis-Picker: Ziel waehlen (Kapitel/Abbildung) + Anzeigeform.
       Die Nummer in der Liste ist eine VORSCHAU — was im Export steht,
       entscheidet der Ausgabeweg (siehe editor/notebook/toolbar/xref.js). -->
  <template x-teleport="body">
    <div x-show="xrefShow && $app.editMode && !$app.focusActive" x-cloak
         class="edit-cite-panel edit-xref-panel"
         role="dialog"
         :aria-label="$app.t('editor.toolbar.xrefTitle')"
         :style="{ left: xrefX + 'px', top: xrefY + 'px' }"
         @click.outside="_closeXref()"
         @keydown="_onXrefKeydown($event)"
         @mousedown.stop>
      <div class="edit-cite-row">
        <input type="text" x-ref="xrefFilter"
               x-model="xrefQuery"
               :placeholder="$app.t('editor.toolbar.xrefFilterPlaceholder')"
               :aria-label="$app.t('editor.toolbar.xrefFilterPlaceholder')"
               class="edit-cite-input edit-cite-input--filter">
      </div>
      <!-- Anzeigeform: „Kapitel 3" / „3" / „Kapitel 3: Titel". -->
      <div class="seg-toggle edit-cite-kind" role="group"
           :aria-label="$app.t('editor.toolbar.xrefFmtLabel')">
        <button type="button" :class="{ 'seg-toggle--active': xrefFmt === 'label' }"
                @click="xrefFmt = 'label'"
                :data-tip="$app.t('editor.toolbar.xrefFmtLabelTip')"
                x-text="$app.t('editor.toolbar.xrefFmtLabelShort')"></button>
        <button type="button" :class="{ 'seg-toggle--active': xrefFmt === 'number' }"
                @click="xrefFmt = 'number'"
                :data-tip="$app.t('editor.toolbar.xrefFmtNumberTip')"
                x-text="$app.t('editor.toolbar.xrefFmtNumberShort')"></button>
        <button type="button" :class="{ 'seg-toggle--active': xrefFmt === 'title' }"
                @click="xrefFmt = 'title'"
                :data-tip="$app.t('editor.toolbar.xrefFmtTitleTip')"
                x-text="$app.t('editor.toolbar.xrefFmtTitleShort')"></button>
      </div>
      <div class="edit-cite-hint" x-show="xrefLoading" x-text="$app.t('common.loading')"></div>
      <div class="edit-cite-hint" x-show="xrefError" x-text="$app.t('editor.toolbar.xrefLoadError')"></div>
      <div class="edit-cite-hint" x-show="!xrefLoading && !xrefError && xrefHits.length === 0"
           x-text="$app.t('editor.toolbar.xrefEmpty')"></div>
      <ul class="edit-cite-list" role="listbox" x-show="xrefHits.length > 0">
        <template x-for="(hit, i) in xrefHits" :key="hit.kind + ':' + hit.target">
          <li role="option"
              :aria-selected="i === xrefIdx"
              class="edit-cite-item edit-xref-item"
              :class="{ 'is-active': i === xrefIdx }"
              :data-depth="hit.depth"
              @mouseenter="xrefIdx = i"
              @click="_commitXref(hit)">
            <span class="edit-xref-preview" x-text="xrefPreview(hit)"></span>
            <span class="edit-xref-title" x-text="hit.title"></span>
          </li>
        </template>
      </ul>
    </div>
  </template>

  <!-- Quellen-Picker (Quellenverzeichnis): Quelle waehlen + Stellenangabe -->
  <template x-teleport="body">
    <div x-show="citeShow && $app.editMode && !$app.focusActive" x-cloak
         class="edit-cite-panel"
         role="dialog"
         :aria-label="$app.t('editor.toolbar.citeTitle')"
         :style="{ left: citeX + 'px', top: citeY + 'px' }"
         @click.outside="_closeCite()"
         @keydown="_onCiteKeydown($event)"
         @mousedown.stop>
      <div class="edit-cite-row">
        <input type="text" x-ref="citeFilter"
               x-model="citeQuery"
               :placeholder="$app.t('editor.toolbar.citeFilterPlaceholder')"
               :aria-label="$app.t('editor.toolbar.citeFilterPlaceholder')"
               class="edit-cite-input edit-cite-input--filter">
        <input type="text"
               x-model="citeLoc"
               :placeholder="$app.t('editor.toolbar.citeLocPlaceholder')"
               :aria-label="$app.t('editor.toolbar.citeLocPlaceholder')"
               class="edit-cite-input edit-cite-input--loc">
      </div>
      <!-- Zitat-Art: woertliches Kurzzitat / Blockzitat / Paraphrase („vgl.").
           Blockzitat huellt den Absatz um und ist darum nur in umhuellbaren
           Bloecken verfuegbar (citeBlockOk). -->
      <div class="seg-toggle edit-cite-kind" role="group"
           :aria-label="$app.t('editor.toolbar.citeKindLabel')">
        <button type="button" :class="{ 'seg-toggle--active': citeKind === 'quote' }"
                @click="citeKind = 'quote'"
                :data-tip="$app.t('editor.toolbar.citeKindQuoteTip')"
                x-text="$app.t('editor.toolbar.citeKindQuote')"></button>
        <button type="button" :class="{ 'seg-toggle--active': citeKind === 'block' }"
                @click="citeKind = 'block'" :disabled="!citeBlockOk"
                :data-tip="citeBlockOk ? $app.t('editor.toolbar.citeKindBlockTip') : $app.t('editor.toolbar.citeKindBlockUnavailable')"
                x-text="$app.t('editor.toolbar.citeKindBlock')"></button>
        <button type="button" :class="{ 'seg-toggle--active': citeKind === 'paraphrase' }"
                @click="citeKind = 'paraphrase'"
                :data-tip="$app.t('editor.toolbar.citeKindParaphraseTip')"
                x-text="$app.t('editor.toolbar.citeKindParaphrase')"></button>
      </div>
      <div class="edit-cite-hint" x-show="citeLoading" x-text="$app.t('common.loading')"></div>
      <div class="edit-cite-hint" x-show="citeError" x-text="$app.t('editor.toolbar.citeLoadError')"></div>
      <div class="edit-cite-hint" x-show="!citeLoading && !citeError && citeHits.length === 0"
           x-text="$app.t('editor.toolbar.citeEmpty')"></div>
      <ul class="edit-cite-list" role="listbox" x-show="citeHits.length > 0">
        <template x-for="(hit, i) in citeHits" :key="hit.id">
          <li role="option"
              :aria-selected="i === citeIdx"
              class="edit-cite-item"
              :class="{ 'is-active': i === citeIdx }"
              @mouseenter="citeIdx = i"
              @click="_commitCite(hit.src)"
              x-text="hit.label"></li>
        </template>
      </ul>
    </div>
  </template>

  <!-- Link-Input -->
  <template x-teleport="body">
    <div x-show="linkShow && $app.editMode && !$app.focusActive" x-cloak
         class="edit-link-bar"
         :style="{ left: linkX + 'px', top: linkY + 'px' }"
         @click.outside="_closeLink()"
         @mousedown.stop>
      <input type="text" x-ref="linkInput"
             x-model="linkUrl"
             @keydown="_onLinkKeydown($event)"
             :placeholder="$app.t('editor.toolbar.linkPlaceholder')"
             :aria-label="$app.t('editor.toolbar.linkTitle')"
             class="edit-link-input">
      <button type="button" class="edit-link-btn" @click="_commitLink()"
              :data-tip="$app.t('editor.toolbar.linkApply')"
              :aria-label="$app.t('editor.toolbar.linkApply')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#check"/></svg>
      </button>
      <button type="button" class="edit-link-btn" x-show="linkCanRemove" @click="_removeLink()"
              :data-tip="$app.t('editor.toolbar.linkRemove')"
              :aria-label="$app.t('editor.toolbar.linkRemove')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#unlink"/></svg>
      </button>
    </div>
  </template>

  <!-- Slash-Menü (Block-Transforms) -->
  <template x-teleport="body">
    <div x-show="slashShow && $app.editMode && !$app.focusActive" x-cloak
         class="edit-slash-menu"
         x-ref="slashMenu"
         role="listbox"
         :aria-label="$app.t('editor.slash.ariaLabel')"
         :aria-activedescendant="slashShow ? ('edit-slash-opt-' + slashIdx) : null"
         :style="{ left: slashX + 'px', top: slashY + 'px', maxHeight: slashMaxH + 'px' }"
         @click.outside="_closeSlash()">
      <div class="edit-slash-hint" :class="{ 'edit-slash-hint--query': slashQuery }">
        <span x-show="!slashQuery" x-text="$app.t('editor.slash.hint')"></span>
        <span x-show="slashQuery" class="edit-slash-query"><span class="edit-slash-query-slash">/</span><span x-text="slashQuery"></span></span>
      </div>
      <template x-for="(it, i) in slashItems()" :key="it.key">
        <div class="edit-slash-row" role="presentation">
          <div x-show="it.showGroup"
               class="edit-slash-group" x-text="it.groupLabel"></div>
          <button type="button"
                  class="edit-slash-item"
                  role="option"
                  :id="'edit-slash-opt-' + i"
                  :aria-selected="slashIdx === i"
                  :class="it.modClass + (slashIdx === i ? ' edit-slash-item--active' : '')"
                  @mousedown.prevent
                  @click="_applySlashByKey(it.key)"
                  @mouseenter="slashIdx = i">
            <span class="edit-slash-label" x-text="it.label"></span>
            <span x-show="it.preview" class="edit-slash-prev" x-text="it.preview"></span>
          </button>
        </div>
      </template>
      <div x-show="slashItems().length === 0" class="edit-slash-empty"
           x-text="$app.t('editor.slash.noMatch')"></div>
    </div>
  </template>
</div>
