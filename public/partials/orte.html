<!-- Schauplätze -->
<!--
  Alpine.data-Sub-Komponente — siehe public/js/cards/orte-card.js.
  Fachdaten (orte, szenen, figuren) leben in Alpine.store('catalog');
  orteFilters + selectedOrtId bleiben im Root.
-->
<div class="card card--orte" x-data="orteCard" x-show="$app.showOrteCard" x-cloak>
  <div class="card-header card-header--subline">
    <div class="card-header-titlebar">
      <span class="card-eyebrow" x-text="$app.selectedBookName"></span>
      <span class="card-title" x-text="$app.t('orte.title')"></span>
      <div class="card-subline" x-show="$store.jobs.alleAktualisierenLastRun && !orteLoading">
        <span class="card-timestamp" x-text="$app.t('common.asOf', { date: $store.jobs.alleAktualisierenLastRun })"></span>
      </div>
    </div>
  </div>

  <div x-show="orteProgress > 0" class="progress-bar-wrap">
    <div class="progress-bar" :style="{ '--progress': orteProgress + '%' }"></div>
  </div>
  <div x-show="orteStatus" class="card-status" x-html="orteStatus"></div>

  <div x-show="$store.catalog.orte.length === 0 && !orteLoading && !orteStatus" class="card-empty">
    <p class="card-empty-text" x-text="$app.t('common.noAnalysisYet')"></p>
    <p class="card-empty-hint" x-text="$app.t('empty.orte.hint')"></p>
    <button type="button" class="primary card-empty-cta"
            @click="$app.alleAktualisieren()"
            :disabled="$store.jobs.alleAktualisierenLoading || !$store.nav.selectedBookId">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg?v=691#rotate-cw"/></svg>
      <span x-text="$app.t('header.updateAll')"></span>
    </button>
  </div>

  <!-- Skeleton während Loading vor erstem Datensatz -->
  <div x-show="orteLoading && $store.catalog.orte.length === 0" class="entity-skeleton entity-list--accented" x-cloak>
    <template x-for="i in 6" :key="i">
      <div class="entity-skeleton-row">
        <span class="entity-skeleton-cell entity-skeleton-cell--anchor"></span>
        <span class="entity-skeleton-cell entity-skeleton-cell--title"></span>
        <span class="entity-skeleton-cell entity-skeleton-cell--meta"></span>
      </div>
    </template>
  </div>

  <!-- Ansicht-Umschalter (Liste / Grid / Karte) — Karte nur bei realen Orten -->
  <div x-show="$store.catalog.orte.length > 0" class="tabs entity-view-toggle" role="tablist" :aria-label="$app.t('orte.viewLabel')">
    <template x-for="m in (orteRealEnabled ? ['list','grid','map'] : ['list','grid'])" :key="m">
      <button type="button" role="tab"
              class="tabs-btn"
              :class="{ 'tabs-btn--active': viewMode === m }"
              :aria-selected="viewMode === m"
              @click="viewMode = m"
              x-text="$app.t('orte.view.' + m)"></button>
    </template>
  </div>

  <!-- Filter-Leiste -->
  <div x-show="$store.catalog.orte.length > 0" class="filter-bar">
    <span class="filter-search-wrap">
      <input type="text" x-model="$store.catalogUi.orteFilters.suche" :placeholder="$app.t('common.search')" :aria-label="$app.t('common.search')" class="filter-search-input">
      <button type="button" class="search-clear--icon" x-show="$store.catalogUi.orteFilters.suche" @click="$store.catalogUi.orteFilters.suche=''" :aria-label="$app.t('search.clear')" :data-tip="$app.t('search.clear')"><svg class="icon" aria-hidden="true"><use href="/icons.svg?v=690#x"/></svg></button>
    </span>
    <div x-data="catalogFilter('figur')"
         x-modelable="value" x-model="$store.catalogUi.orteFilters.figurId"
         x-effect="options = $store.catalog.figuren.filter(f => $store.catalog.orte.some(o => (o.figuren || []).includes(f.id))).map(f => ({value: f.id, label: f.kurzname || f.name}))"
         >
    </div>
    <div x-data="catalogFilter('chapter')"
         x-modelable="value" x-model="$store.catalogUi.orteFilters.kapitel"
         x-effect="options = $app.orteKapitelListe().map(k => ({value: k, label: k}))"
         >
    </div>
    <div x-show="$store.catalog.szenen.length > 0"
         x-data="catalogFilter('szene')"
         x-modelable="value" x-model="$store.catalogUi.orteFilters.szeneId"
         x-effect="options = $store.catalog.szenen.map(s => ({value: String(s.id), label: s.titel}))"
         >
    </div>
    <span class="filter-count" x-text="orteFiltered.length + ' / ' + $store.catalog.orte.length"></span>
  </div>

  <!-- Ortsliste -->
  <div x-show="$store.catalog.orte.length > 0 && viewMode === 'list'" class="entity-list entity-list--accented ort-list">
    <template x-for="o in orteFiltered" :key="o.id">
      <div>
        <div class="entity-row" :class="{ 'entity-row--stale': o.stale }" :data-ortid="o.id" @click="$store.catalogUi.selectedOrtId = $store.catalogUi.selectedOrtId === o.id ? null : o.id">
          <span class="tag entity-typ-tag" x-text="o.typ || $app.t('orte.typAndere')"></span>
          <span class="entity-row-title" x-text="o.name"></span>
          <span x-show="o.stale" class="tag tag--stale" :data-tip="$app.t('orte.staleHint')" x-text="$app.t('orte.staleBadge')"></span>
          <button type="button" x-show="o.stale" class="icon-btn danger entity-row-delete"
                  @click.stop="$app.deleteStaleOrt(o)"
                  :aria-label="$app.t('common.delete')" :data-tip="$app.t('entity.deleteStale')">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg?v=690#trash"/></svg>
          </button>
          <span x-show="o.land" class="tag ort-land-tag" x-text="landLabel(o.land)"></span>
          <span x-show="o.stimmung" class="ort-stimmung" x-text="o.stimmung"></span>
          <template x-if="o.kapitel?.length">
            <span class="kapitel-badges">
              <span class="kapitel-badge kapitel-badge--primary internal-link" @click.stop="$app.openKapitelByName(o.kapitel[0].name)" x-text="o.kapitel[0].name"></span>
              <template x-if="o.kapitel.length > 1">
                <span class="kapitel-badge kapitel-badge--more" x-text="'+' + (o.kapitel.length - 1)"></span>
              </template>
            </span>
          </template>
          <span class="history-chevron" :class="{ open: $store.catalogUi.selectedOrtId === o.id }" aria-hidden="true"></span>
        </div>
        <div x-show="$store.catalogUi.selectedOrtId === o.id" class="entity-detail">
          <p x-show="o.beschreibung" x-text="o.beschreibung" class="entity-detail-text"></p>
          <div x-show="o.erste_erwaehnung" class="entity-meta-row">
            <span class="entity-meta-label" x-text="$app.t('orte.firstMention')"></span>
            <template x-if="o.erste_erwaehnung_page_id">
              <span class="internal-link" @click.stop="$app.gotoPageById(o.erste_erwaehnung_page_id)" x-text="o.erste_erwaehnung"></span>
            </template>
            <template x-if="!o.erste_erwaehnung_page_id">
              <span x-text="o.erste_erwaehnung"></span>
            </template>
          </div>
          <div x-show="o.figuren?.length > 0" class="entity-meta-row">
            <span class="entity-meta-label" x-text="$app.t('orte.figuren')"></span>
            <template x-for="figId in o.figuren" :key="figId">
              <span class="tag internal-link" @click.stop="$app.openFigurById(figId)" x-text="$app.figurenById.get(figId)?.kurzname || $app.figurenById.get(figId)?.name || figId"></span>
            </template>
          </div>
          <div x-show="o.kapitel?.length > 1" class="entity-meta-row">
            <span class="entity-meta-label" x-text="$app.t('orte.kapitel')"></span>
            <template x-for="k in o.kapitel" :key="k.name">
              <span class="tag internal-link" @click.stop="$app.openKapitelByName(k.name)" x-text="k.name + (k.haeufigkeit > 1 ? ' ×' + k.haeufigkeit : '')"></span>
            </template>
          </div>
          <div x-show="$store.catalog.szenen.some(s => (s.ort_ids||[]).includes(o.id))" class="entity-meta-row">
            <span class="entity-meta-label" x-text="$app.t('orte.szenen')"></span>
            <template x-for="s in $store.catalog.szenen.filter(s => (s.ort_ids||[]).includes(o.id))" :key="s.id">
              <span class="tag" x-text="s.titel"></span>
            </template>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- Grid (Matrix): sortierbare Tabelle aller gefilterten Schauplätze -->
  <div x-show="$store.catalog.orte.length > 0 && viewMode === 'grid'" class="table-scroll" x-cloak>
    <table class="entity-grid-table"
           x-data="sortableTable({
             rows: () => orteGridRows(),
             defaultKey: 'name',
             types: { typ: 'string', name: 'string', landLabelText: 'string', stimmung: 'string' },
             persistKey: 'orte.grid',
           })">
      <thead>
        <tr>
          <th class="sortable-th" :class="sortClass('typ')" :aria-sort="ariaSort('typ')"
              @click="sortBy('typ')" x-text="$app.t('orte.col.typ')"></th>
          <th class="sortable-th" :class="sortClass('name')" :aria-sort="ariaSort('name')"
              @click="sortBy('name')" x-text="$app.t('orte.col.name')"></th>
          <th class="sortable-th" :class="sortClass('landLabelText')" :aria-sort="ariaSort('landLabelText')"
              @click="sortBy('landLabelText')" x-text="$app.t('orte.col.land')"></th>
          <th class="sortable-th" :class="sortClass('stimmung')" :aria-sort="ariaSort('stimmung')"
              @click="sortBy('stimmung')" x-text="$app.t('orte.col.stimmung')"></th>
          <th x-text="$app.t('orte.col.kapitel')"></th>
          <th x-text="$app.t('orte.col.erste')"></th>
          <th x-text="$app.t('orte.col.figuren')"></th>
          <th x-text="$app.t('orte.col.beschreibung')"></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="o in sorted" :key="o.id">
          <tr>
            <td><span class="tag entity-typ-tag" x-text="o.typ || $app.t('orte.typAndere')"></span></td>
            <td class="entity-grid-cell-title">
              <span x-text="o.name"></span>
              <button type="button" x-show="o.stale" class="icon-btn danger entity-row-delete"
                      @click.stop="$app.deleteStaleOrt(o)"
                      :aria-label="$app.t('common.delete')" :data-tip="$app.t('entity.deleteStale')">
                <svg class="icon" aria-hidden="true"><use href="/icons.svg?v=690#trash"/></svg>
              </button>
            </td>
            <td><span x-show="o.land" class="tag ort-land-tag" x-text="landLabel(o.land)"></span></td>
            <td x-text="o.stimmung"></td>
            <td>
              <span class="entity-grid-tags">
                <template x-for="k in (o.kapitel || [])" :key="k.name">
                  <span class="kapitel-badge kapitel-badge--primary internal-link"
                        @click="$app.openKapitelByName(k.name)"
                        x-text="k.name"></span>
                </template>
              </span>
            </td>
            <td>
              <template x-if="o.erste_erwaehnung && o.erste_erwaehnung_page_id">
                <span class="kapitel-badge kapitel-badge--secondary internal-link"
                      @click="$app.gotoPageById(o.erste_erwaehnung_page_id)"
                      x-text="o.erste_erwaehnung"></span>
              </template>
              <template x-if="o.erste_erwaehnung && !o.erste_erwaehnung_page_id">
                <span x-text="o.erste_erwaehnung"></span>
              </template>
            </td>
            <td>
              <span class="entity-grid-tags">
                <template x-for="figId in (o.figuren || [])" :key="figId">
                  <span class="tag internal-link"
                        @click="$app.openFigurById(figId)"
                        x-text="$app.figurenById.get(figId)?.kurzname || $app.figurenById.get(figId)?.name || figId"></span>
                </template>
              </span>
            </td>
            <td class="entity-grid-cell-text" x-text="o.beschreibung"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

  <!-- Geo-Karte: Marker je verorteter Schauplatz + Geocode-Liste -->
  <div x-show="$store.catalog.orte.length > 0 && viewMode === 'map'" class="ort-map-view" x-cloak>
    <div class="ort-map-actions">
      <button type="button" class="icon-btn"
              :disabled="_geoUndoStack.length === 0"
              @click="undoGeoMove()"
              :data-tip="$app.t('orte.map.undoTip')" :aria-label="$app.t('orte.map.undo')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg?v=690#undo"/></svg>
      </button>
      <button type="button" class="icon-btn"
              :disabled="_geoRedoStack.length === 0"
              @click="redoGeoMove()"
              :data-tip="$app.t('orte.map.redoTip')" :aria-label="$app.t('orte.map.redo')">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg?v=690#redo"/></svg>
      </button>
      <button type="button" class="icon-btn"
              :aria-pressed="geoLocked"
              @click="toggleGeoLock()"
              :data-tip="$app.t(geoLocked ? 'orte.map.unlockTip' : 'orte.map.lockTip')"
              :aria-label="$app.t(geoLocked ? 'orte.map.unlock' : 'orte.map.lock')">
        <svg class="icon" aria-hidden="true"><use :href="(geoLocked ? '/icons.svg?v=690#lock' : '/icons.svg?v=690#lock-open')"/></svg>
      </button>
    </div>
    <div x-ref="orteMapEl" class="ort-map" role="application" :aria-label="$app.t('orte.map.tab')"></div>
    <p class="card-hint card-hint--sm" x-text="$app.t(geoLocked ? 'orte.map.lockedHint' : 'orte.map.dragHint')"></p>
    <div class="card-section-head">
      <span class="ort-map-locate-count"
            x-text="$app.t('orte.map.unlocatedCount', { n: unlocatedOrte().length, total: orteFiltered.length })"></span>
      <button type="button" class="btn-compact"
              x-show="unlocatedOrte().length > 0"
              :disabled="geocodingAll || geocodingId != null"
              @click="geocodeAllUnlocated()"
              x-text="geocodingAll ? $app.t('orte.map.geocoding') : $app.t('orte.map.geocodeAll')"></button>
    </div>
    <div x-show="orteMapStatus" class="card-status" x-text="orteMapStatus"></div>
    <div class="ort-map-locate-list">
      <template x-for="o in orteFiltered" :key="o.id">
        <div class="ort-map-locate-row" :data-ortid="o.id"
             :class="{ 'ort-map-locate-row--active': highlightOrtId === o.id }"
             @mouseenter="if (o.lat != null && o.lng != null) focusMapMarker(o.id)">
          <span class="tag entity-typ-tag" x-text="o.typ || $app.t('orte.typAndere')"></span>
          <span class="ort-map-locate-name" x-text="o.name"></span>
          <span x-show="o.lat != null && o.lng != null" class="ort-map-located" x-text="$app.t('orte.map.located')"></span>
          <button type="button" class="btn-compact"
                  :disabled="geocodingId === o.id || geocodingAll || (o.lat != null && o.lng != null)"
                  @click="geocodeOrt(o)"
                  x-text="geocodingId === o.id ? $app.t('orte.map.geocoding') : $app.t('orte.map.geocode')"></button>
          <button type="button" class="btn-compact danger"
                  x-show="o.lat != null && o.lng != null"
                  :disabled="geocodingAll"
                  @click="clearGeoref(o)"
                  x-text="$app.t('orte.map.clearGeoref')"></button>
        </div>
      </template>
    </div>
    <div class="ort-map-footer" x-show="$store.catalog.orte.some(o => o.lat != null && o.lng != null)">
      <button type="button" class="btn-compact danger"
              :disabled="geocodingAll || geocodingId != null"
              @click="clearAllGeorefs()"
              x-text="$app.t('orte.map.clearAll')"></button>
    </div>
  </div>
</div>
